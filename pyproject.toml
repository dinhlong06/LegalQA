[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "legalqa-v11"
version = "11.0.0"
description = "UIT DSC 2026 · Task 2 LegalQA — private-test reproduction package (Team Artiz)"
license = { text = "MIT" }
requires-python = ">=3.10"
# Phụ thuộc KHÔNG khai ở đây — môi trường pin chính xác nằm trong requirements.txt ở gốc gói
# (xem Dockerfile: cài requirements rồi `pip install --no-deps -e .` để lấy console script).
dependencies = []

[project.scripts]
legalqa = "legalqa.cli:main"

[tool.setuptools]
packages = ["legalqa"]
